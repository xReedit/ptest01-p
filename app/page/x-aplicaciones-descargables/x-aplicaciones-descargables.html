"alt="WhatsApp"></div><div><h4>Mensajeria - Vincular WhatsApp</h4><span>Se vincula desde el sistema, no se instala nada</span></div></div><p>Conecta el WhatsApp del local para que el sistema envie mensajes automaticos a tus clientes: confirmacion y estado de pedidos, comprobantes y avisos de delivery.<p class="apd-nota">Solo necesitas el celular con el WhatsApp del negocio para escanear el codigo de vinculacion.</p><button class="btn btn-sm btn-success"on-click="_irMensajeria"><i class="fa fa-whatsapp"></i> Vincular WhatsApp</button></div><div class="apd-card"><div class="apd-head"><div class="apd-ico"><img src="../../../images/_wizpay_64.png"alt="WizPay"></div><div><h4>WizPay - Vincular Yape / Plin</h4><span>Solo Android</span></div></div><p>El dueño instala WizPay en el celular donde recibe los Yape y Plin. Cada pago que entra se confirma al instante en la computadora de caja, sin llamar al dueño ni depender de capturas de pantalla.<div class="apd-tiendas"><div class="apd-tienda"><canvas data-qr="https://play.google.com/store/apps/details?id=pe.papaya.wizpay"></canvas><a class="btn btn-sm btn-success"href="https://play.google.com/store/apps/details?id=pe.papaya.wizpay"target="_blank"rel="noopener"><i class="fa fa-android"></i> Android</a></div></div><br><button class="btn btn-sm btn-primary"on-click="_irYape">Ver como vincular</button></div><div class="apd-card"><div class="apd-head"><div class="apd-ico apd-logo"><img src="../../../images/logo-app-mozo.webp"alt="App Mozo"></div><div><h4>Papaya App Mozo</h4><span>Para los meseros - Android y iPhone</span></div></div><p>El mozo toma los pedidos desde su celular en la mesa: ve la carta y el stock, envia la comanda a cocina y bar al instante y puede pedir la cuenta sin ir a la caja.<p class="apd-nota">Entra con su usuario del sistema (perfil Mesero / Mozo).<div class="apd-tiendas"><div class="apd-tienda"><canvas data-qr="https://play.google.com/store/apps/details?id=mozo.papaya.com.pe"></canvas><a class="btn btn-sm btn-success"href="https://play.google.com/store/apps/details?id=mozo.papaya.com.pe"target="_blank"rel="noopener"><i class="fa fa-android"></i> Android</a></div><div class="apd-tienda"><canvas data-qr="https://apps.apple.com/pe/app/papaya-app-mozo/id1666630936"></canvas><a class="btn btn-sm btn-light"href="https://apps.apple.com/pe/app/papaya-app-mozo/id1666630936"target="_blank"rel="noopener"><i class="fa fa-apple"></i> iPhone</a></div></div></div><div class="apd-card"><div class="apd-head"><div class="apd-ico apd-logo"><img src="../../../images/logo-app-repartidor.webp"alt="App Repartidor"></div><div><h4>Papaya Repartidor</h4><span>Para los repartidores - Android y iPhone</span></div></div><p>El repartidor ve los pedidos que tiene asignados, la direccion en el mapa y marca cada entrega. Su ubicacion aparece en Tracker Delivery para que sepas donde esta cada pedido.<p class="apd-nota">Entra con su usuario del sistema (perfil Repartidor). Tambien puede usarla desde el navegador en <b>reparto.papaya.com.pe</b>.<div class="apd-tiendas"><div class="apd-tienda"><canvas data-qr="https://play.google.com/store/apps/details?id=papaya.com.pe.repartidor"></canvas><a class="btn btn-sm btn-success"href="https://play.google.com/store/apps/details?id=papaya.com.pe.repartidor"target="_blank"rel="noopener"><i class="fa fa-android"></i> Android</a></div><div class="apd-tienda"><canvas data-qr="https://apps.apple.com/pe/app/papaya-repartidor/id1661062301"></canvas><a class="btn btn-sm btn-light"href="https://apps.apple.com/pe/app/papaya-repartidor/id1661062301"target="_blank"rel="noopener"><i class="fa fa-apple"></i> iPhone</a></div></div></div><div class="apd-card"><div class="apd-head"><div class="apd-ico apd-logo"><img src="../../../images/logo-app-mozo.webp"alt="App Mozo PC"></div><div><h4>Papaya App Mozo - Punto de pedido</h4><span>Para computadora (PC)</span></div></div><p>Es la App Mozo instalada en una computadora fija, pensada para un <b>punto de pedido</b>: la barra, el mostrador o una pantalla tactil al lado de la cocina.<ul><li>Varios mozos toman pedidos desde el mismo equipo, cada uno con su usuario.<li>Pantalla grande: carta, mesas y comandas mas faciles de leer y tocar.<li>Sirve donde no conviene tener un celular por mozo.</ul><a id="mozoPcWin"class="btn btn-sm btn-primary"href="https://papaya-comercio-files.s3.us-east-2.amazonaws.com/installers/Papaya-App-Mozo_1.0.11_x64-setup.exe"target="_blank"rel="noopener"><i class="fa fa-windows"></i> Descargar para Windows</a> <a id="mozoPcMac"class="btn btn-sm btn-light"href="#"target="_blank"rel="noopener"style="display:none"><i class="fa fa-apple"></i> Descargar para Mac</a><p class="apd-nota"id="mozoPcVersion"></div></div></div></div><br></template></dom-module><script>Polymer({is:"x-aplicaciones-descargables",attached:function(){for(var e=Polymer.dom(this.root).querySelectorAll("canvas[data-qr]"),r=0;r<e.length;r++)try{new QRious({element:e[r],value:e[r].getAttribute("data-qr"),size:120,level:"M"})}catch(e){}this._cargarMozoPc()},_cargarMozoPc:function(){var t=this.root;fetch("https://papaya-comercio-files.s3.us-east-2.amazonaws.com/installers/latest_app_mozo.json",{cache:"no-store"}).then(function(e){if(e.ok)return e.json();throw new Error("HTTP "+e.status)}).then(function(e){var r=e.platforms||{},o=r["windows-x86_64"],r=r["darwin-aarch64"]||r["darwin-x86_64"];o&&o.url&&(t.querySelector("#mozoPcWin").href=o.url),r&&r.url&&((o=t.querySelector("#mozoPcMac")).href=r.url,o.style.display=""),e.version&&(t.querySelector("#mozoPcVersion").textContent="Version "+e.version)}).catch(function(e){})},_irMensajeria:function(){this._ir("/mensajeria")},_irYape:function(){this._ir("/vincular_yape")},_ir:function(e){(router||document.querySelector("app-router")).go(e)}})</script>
