<dom-module id="x-tracker-delivery"><script src="../../js/qrious.js"></script><template><paper-dialog modal id="dlg_trk_ayuda"class="xdlg"entry-animation="scale-up-animation"exit-animation="fade-out-animation"><div class="xContent"><div class="xdlg-head"><h3>Como activar el seguimiento</h3><p>Para que esta pantalla funcione hacen falta tres cosas: que el repartidor reporte su ubicacion desde la aplicacion, que la direccion del pedido tenga coordenadas, y que tu local este bien ubicado en el mapa.</div><div class="xdlg-body"><div class="inv-titulo-sec">El repartidor</div><div class="trk-pasos"><div class="trk-paso"><span class="trk-paso-num">1</span><div><b>Creale un usuario con perfil de repartidor</b><p>Entra como administrador al modulo <b>Usuarios</b>, crea el usuario de la persona y elige el <b>perfil Repartidor</b>. Ese usuario y su contrasena son los que va a usar para entrar a la aplicacion.</div></div><div class="trk-paso"><span class="trk-paso-num">2</span><div><b>Que instale Papaya Repartidor en su celular</b><p>Que apunte la camara al codigo que le corresponda. Si prefiere no instalar nada, tambien puede entrar desde el navegador a <b>reparto.papaya.com.pe</b>.<div class="trk-descarga"><div class="trk-tienda"><canvas id="trk_qr_play"class="trk-qr"></canvas><a class="btn btn-sm btn-success"href="https://play.google.com/store/apps/details?id=papaya.com.pe.repartidor"target="_blank"rel="noopener"><i class="fa fa-android"></i>Android</a></div><div class="trk-tienda"><canvas id="trk_qr_ios"class="trk-qr"></canvas><a class="btn btn-sm btn-light"href="https://apps.apple.com/pe/app/papaya-repartidor/id1661062301"target="_blank"rel="noopener"><i class="fa fa-apple"></i>iPhone</a></div></div></div></div><div class="trk-paso"><span class="trk-paso-num">3</span><div><b>Que inicie sesion y se ponga en linea</b><p>Con el usuario del paso 1. La primera vez el celular le pedira permiso de ubicacion: tiene que aceptarlo, y conviene elegir <b>Mientras se usa la aplicacion</b>. Despues tiene que activar el interruptor de <b>En linea</b>.</div></div></div><div class="inv-titulo-sec">Los pedidos</div><div class="trk-bloque"><label class="inv-check"><input type="checkbox"id="trk_chk_mapa"onchange="xTrkGuardarBusquedaMapa(this.checked)"> Buscar la direccion en un mapa al tomar un pedido de delivery</label><p class="inv-ayuda">Un pedido solo aparece en el mapa si su direccion tiene coordenadas. Con esta opcion activada, al tomar el pedido se elige la direccion sobre un mapa y queda ubicada. Si esta desactivada, la direccion es solo un texto y el pedido se vera en las listas pero no en el mapa.</div><div class="inv-titulo-sec">Tu local</div><div class="trk-bloque"><p class="inv-resumen">El punto naranja del mapa es tu local, y desde ahi se miden todas las distancias y los tiempos. Si no esta donde corresponde, <b>arrastra el marcador</b> o toca el punto exacto.<div class="trk-mapa-sede"id="trk_mapa_sede"></div><div class="trk-sede-pie"><span class="trk-coords"id="trk_coords">—</span> <span class="inv-sep"></span> <button class="btn btn-sm btn-light"id="trk_btn_deshacer"onclick="xTrkResetUbicacion()"disabled="disabled"><i class="fa fa-undo"></i>Deshacer</button> <button class="btn btn-sm btn-success"id="trk_btn_ubicacion"onclick="xTrkGuardarUbicacion()"disabled="disabled"><i class="fa fa-map-marker"></i>Guardar ubicacion</button></div></div></div><div class="xdlg-foot"><button class="btn btn-sm btn-light"dialog-dismiss><i class="fa fa-times"></i>Cerrar</button></div></div></paper-dialog><paper-dialog modal id="dlg_trk_rendir"class="xdlg"entry-animation="scale-up-animation"exit-animation="fade-out-animation"><div class="xContent"><div class="xdlg-head"><h3 id="trk_rend_titulo">Rendicion</h3><p id="trk_rend_sub"></div><div class="xdlg-body"><div class="inv-table-wrap"><table class="inv-table"id="tb_trk_rendicion"><thead><tbody></table></div><div class="inv-titulo-sec">Como te lo paga</div><div class="inv-seg"id="trk_rend_seg"><div class="inv-seg-item activa"data-modo="pedido"onclick='xTrkSetModo("pedido")'><i class="fa fa-list-ul"></i>Segun cada pedido</div><div class="inv-seg-item"data-modo="mano"onclick='xTrkSetModo("mano")'><i class="fa fa-random"></i>Repartir a mano</div></div><p class="inv-ayuda"id="trk_rend_ayuda"><div class="trk-montos"id="trk_rend_montos"></div><div class="trk-rend-pie"id="trk_rend_pie"><button type="button"class="btn btn-sm btn-light"onclick="xTrkAgregarLineaPago()"><i class="fa fa-plus"></i>Otro metodo</button> <span class="trk-rend-dif"id="trk_rend_dif"></span></div><div class="trk-rend-total"><span>Total a tu caja</span> <b id="trk_rend_total">S/ 0.00</b></div><p class="trk-rend-entregas"id="trk_rend_entregas"><div class="trk-acordeon"id="trk_rend_info"><button type="button"class="trk-acordeon-cab"onclick="xTrkToggleInfo()"><i class="fa fa-info-circle"></i>Informacion util <i class="fa fa-chevron-down trk-acordeon-flecha"></i></button><div class="trk-acordeon-cuerpo"><p class="inv-nota">El efectivo entra a la caja de <b id="trk_rend_caja">—</b> y aparece en su cierre. Lo cobrado por otros medios queda registrado pero no suma al efectivo esperado.<p class="inv-nota">Al confirmar, estos pedidos <b>quedan pagados</b> y dejan de figurar como pendientes, para que nadie los vuelva a cobrar por caja. Revisa la lista antes de aceptar.</div></div></div><div class="xdlg-foot"><button class="btn btn-sm btn-light"dialog-dismiss><i class="fa fa-times"></i>Cancelar</button> <button class="btn btn-sm btn-success"id="trk_btn_rendir"onclick="xTrkConfirmarRendicion()"><i class="fa fa-check"></i>Confirmar rendicion</button></div></div></paper-dialog><paper-dialog modal id="dlg_trk_asignar"class="xdlg"entry-animation="scale-up-animation"exit-animation="fade-out-animation"><div class="xContent"><div class="xdlg-head"><h3 id="trk_asig_titulo">Asignar repartidor</h3><p id="trk_asig_sub"></div><div class="xdlg-body"><p class="inv-ayuda">Ordenados por quien llega antes, contando los pedidos que ya lleva encima.<div class="inv-table-wrap"><table class="inv-table"id="tb_trk_candidatos"><thead><tr><th>Repartidor<th>Tipo<th class="inv-num">Lleva<th>Estado<th><tbody></table></div></div><div class="xdlg-foot"><button class="btn btn-sm btn-light"dialog-dismiss><i class="fa fa-times"></i>Cancelar</button></div></div></paper-dialog><paper-dialog modal id="dlg_trk_pedidos"class="xdlg"entry-animation="scale-up-animation"exit-animation="fade-out-animation"><div class="xContent"><div class="xdlg-head"><h3 id="trk_dlg_titulo">Pedidos</h3><p id="trk_dlg_sub"></div><div class="xdlg-body"><div class="inv-table-wrap"><table class="inv-table"id="tb_trk_pedidos"><thead><tbody></table></div><div id="trk_dlg_pagos"></div></div><div class="xdlg-foot"><button class="btn btn-sm btn-light"dialog-dismiss><i class="fa fa-times"></i>Cerrar</button></div></div></paper-dialog><paper-dialog modal id="dlg_trk_recorrido"class="xdlg"entry-animation="scale-up-animation"exit-animation="fade-out-animation"><div class="xContent"><div class="xdlg-head"><h3 id="trk_rec_titulo">Recorrido</h3><p id="trk_rec_sub"></div><div class="xdlg-body"><div id="trk_rec_veredicto"></div><div class="trk-mapa-rec"id="trk_mapa_rec"></div><div class="trk-rec-leyenda"><span><i class="fa fa-home"></i>Local</span> <span><i class="fa fa-circle trk-rec-ini"></i>Inicio del recorrido</span> <span><i class="fa fa-motorcycle"></i>Ultimo punto</span> <span><i class="fa fa-map-marker"></i>Direccion del pedido</span></div><p class="inv-nota">La posicion se guarda cada 30 segundos mientras el pedido esta asignado y sin entregar, y deja de guardarse al marcar la entrega.</div><div class="xdlg-foot"><button class="btn btn-sm btn-light"dialog-dismiss><i class="fa fa-times"></i>Cerrar</button></div></div></paper-dialog><paper-dialog modal id="dlg_trk_cliente"class="xdlg"entry-animation="scale-up-animation"exit-animation="fade-out-animation"><div class="xContent"><div class="xdlg-head"><h3>¿Como va mi pedido?</h3><p>Pedidos delivery de hoy. Se actualiza solo cada 20 segundos.</div><div class="xdlg-body"><div class="trk-cli-fijo"><div class="inv-seg"id="trk_cli_tabs"><div class="inv-seg-item activa"data-tab="pedidos"onclick='xTrkClienteTab("pedidos")'><i class="fa fa-shopping-bag"></i>Pedidos</div><div class="inv-seg-item"data-tab="reps"onclick='xTrkClienteTab("reps")'><i class="fa fa-motorcycle"></i>Repartidores mas demorados</div></div><input class="inv-input"id="trk_cli_buscar"style="width:100%;margin-top:10px"autocomplete="off"placeholder="Escribe el telefono o el nombre del cliente"oninput="xTrkPintarCliente()"></div><div id="trk_cli_pedidos"><div id="trk_cli_lista"></div></div><div id="trk_cli_reps"style="display:none"></div></div><div class="xdlg-foot"><button class="btn btn-sm btn-light"dialog-dismiss><i class="fa fa-times"></i>Cerrar</button></div></div></paper-dialog><paper-dialog modal id="dlg_trk_resumen"class="xdlg"entry-animation="scale-up-animation"exit-animation="fade-out-animation"><div class="xContent"><div class="xdlg-head"><h3>Resumen del dia</h3><p id="trk_res_sub"></div><div class="xdlg-body"><div id="trk_res_sedes"><div class="inv-titulo-sec">Por sede</div><div class="inv-table-wrap"><table class="inv-table"id="tb_trk_res_sedes"><thead><tr><th>Sede<th class="inv-num">Pedidos<th class="inv-num">Entregados<th class="inv-num">En curso<th class="inv-num">Tiempo prom.<th class="inv-num">Demorados<tbody></table></div></div><div class="inv-titulo-sec">Por repartidor</div><div class="inv-table-wrap"><table class="inv-table"id="tb_trk_res_reps"><thead><tr><th>Repartidor<th class="inv-num">Entregados<th class="inv-num">En curso<th class="inv-num">Tiempo prom.<th class="inv-num">Mas lento<th class="inv-num">Demorados<tbody></table></div></div><div class="xdlg-foot"><button class="btn btn-sm btn-light"dialog-dismiss><i class="fa fa-times"></i>Cerrar</button></div></div></paper-dialog><br><div class="xMiCard xradius inv-card"><div class="xEncanezadoCard inv-head"><div class="inv-head-top"><div><h3>Tracker Delivery</h3><p>Donde estan tus repartidores ahora mismo, cuantos pedidos llevan y cuanto estan tardando. Se actualiza solo cada 20 segundos.</div><div class="inv-head-acciones"><span class="trk-alerta"id="trk_alerta"></span> <span class="trk-actualizado"id="trk_actualizado"></span> <button class="btn btn-sm btn-primary"id="trk_btn_cliente"onclick="xTrkAbrirCliente()"><i class="fa fa-search"></i>¿Como va mi pedido?</button> <button class="btn btn-sm btn-light"id="trk_btn_resumen"onclick="xTrkAbrirResumen()"><i class="fa fa-bar-chart"></i>Resumen del dia</button> <button class="btn btn-sm btn-light"onclick="xTrkComoActivar()"><i class="fa fa-question-circle"></i>Como activar el seguimiento</button> <button class="btn btn-sm btn-light"onclick="xTrkCargar()"><i class="fa fa-refresh"></i>Actualizar</button></div></div></div><div class="xContentCard"><div style="display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap"><div class="inv-kpis"id="trk_kpis"style="flex:1 1 auto"></div><select class="inv-select"id="trk_sedes_chips"onchange="xTrkFiltrarSede(this.value)"style="display:none;width:220px;max-width:100%"title="Ver una sede o todas"></select></div><div class="trk-mapa"id="trk_mapa"></div><div class="inv-titulo-sec">Repartidores</div><div class="inv-seg"id="trk_tabs_rep"style="display:none"></div><div class="inv-table-wrap"><table class="inv-table"id="tb_trk_repartidores"><thead><tr><th>Repartidor<th>Tipo<th>Estado<th class="inv-num">Por entregar<th class="inv-num">Entregados<th class="inv-num">Tiempo prom.<th><tbody></table></div><div class="inv-titulo-sec">Pedidos sin repartidor</div><div class="inv-table-wrap"><table class="inv-table"id="tb_trk_sin_asignar"><thead><tr><th>Pedido<th>Cliente<th>Direccion<th class="inv-num">Esperando<th><tbody></table></div></div></div><br><br></template><script>var TRK_INTERVALO_MS=2e4,TRK_SIN_SENAL_MS=3e5,TRK_PEDIDO_TARDE_MIN=45,TRK_FALLOS_MAX=3,TRK_FACTOR_CALLE=1.3,TRK_VEL_KMH=18,TRK_ETA_HOLGURA=1.7,TRK_ETA_PISO
