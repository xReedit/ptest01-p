<dom-module id="x-tracker-delivery"><script src="../../js/qrious.js"></script><template><paper-dialog modal id="dlg_trk_ayuda"class="xdlg"entry-animation="scale-up-animation"exit-animation="fade-out-animation"><div class="xContent"><div class="xdlg-head"><h3>Como activar el seguimiento</h3><p>Para que esta pantalla funcione hacen falta tres cosas: que el repartidor reporte su ubicacion desde la aplicacion, que la direccion del pedido tenga coordenadas, y que tu local este bien ubicado en el mapa.</div><div class="xdlg-body"><div class="inv-titulo-sec">El repartidor</div><div class="trk-pasos"><div class="trk-paso"><span class="trk-paso-num">1</span><div><b>Creale un usuario con perfil de repartidor</b><p>Entra como administrador al modulo <b>Usuarios</b>, crea el usuario de la persona y elige el <b>perfil Repartidor</b>. Ese usuario y su contrasena son los que va a usar para entrar a la aplicacion.</div></div><div class="trk-paso"><span class="trk-paso-num">2</span><div><b>Que instale Papaya Repartidor en su celular</b><p>Que apunte la camara al codigo que le corresponda. Si prefiere no instalar nada, tambien puede entrar desde el navegador a <b>reparto.papaya.com.pe</b>.<div class="trk-descarga"><div class="trk-tienda"><canvas id="trk_qr_play"class="trk-qr"></canvas><a class="btn btn-sm btn-success"href="https://play.google.com/store/apps/details?id=papaya.com.pe.repartidor"target="_blank"rel="noopener"><i class="fa fa-android"></i>Android</a></div><div class="trk-tienda"><canvas id="trk_qr_ios"class="trk-qr"></canvas><a class="btn btn-sm btn-light"href="https://apps.apple.com/pe/app/papaya-repartidor/id1661062301"target="_blank"rel="noopener"><i class="fa fa-apple"></i>iPhone</a></div></div></div></div><div class="trk-paso"><span class="trk-paso-num">3</span><div><b>Que inicie sesion y se ponga en linea</b><p>Con el usuario del paso 1. La primera vez el celular le pedira permiso de ubicacion: tiene que aceptarlo, y conviene elegir <b>Mientras se usa la aplicacion</b>. Despues tiene que activar el interruptor de <b>En linea</b>.</div></div></div><div class="inv-titulo-sec">Los pedidos</div><div class="trk-bloque"><label class="inv-check"><input type="checkbox"id="trk_chk_mapa"onchange="xTrkGuardarBusquedaMapa(this.checked)"> Buscar la direccion en un mapa al tomar un pedido de delivery</label><p class="inv-ayuda">Un pedido solo aparece en el mapa si su direccion tiene coordenadas. Con esta opcion activada, al tomar el pedido se elige la direccion sobre un mapa y queda ubicada. Si esta desactivada, la direccion es solo un texto y el pedido se vera en las listas pero no en el mapa.</div><div class="inv-titulo-sec">Tu local</div><div class="trk-bloque"><p class="inv-resumen">El punto naranja del mapa es tu local, y desde ahi se miden todas las distancias y los tiempos. Si no esta donde corresponde, <b>arrastra el marcador</b> o toca el punto exacto.<div class="trk-mapa-sede"id="trk_mapa_sede"></div><div class="trk-sede-pie"><span class="trk-coords"id="trk_coords">—</span> <span class="inv-sep"></span> <button class="btn btn-sm btn-light"id="trk_btn_deshacer"onclick="xTrkResetUbicacion()"disabled="disabled"><i class="fa fa-undo"></i>Deshacer</button> <button class="btn btn-sm btn-success"id="trk_btn_ubicacion"onclick="xTrkGuardarUbicacion()"disabled="disabled"><i class="fa fa-map-marker"></i>Guardar ubicacion</button></div></div></div><div class="xdlg-foot"><button class="btn btn-sm btn-light"dialog-dismiss><i class="fa fa-times"></i>Cerrar</button></div></div></paper-dialog><paper-dialog modal id="dlg_trk_asignar"class="xdlg"entry-animation="scale-up-animation"exit-animation="fade-out-animation"><div class="xContent"><div class="xdlg-head"><h3 id="trk_asig_titulo">Asignar repartidor</h3><p id="trk_asig_sub"></div><div class="xdlg-body"><p class="inv-ayuda">Ordenados por quien llega antes, contando los pedidos que ya lleva encima.<div class="inv-table-wrap"><table class="inv-table"id="tb_trk_candidatos"><thead><tr><th>Repartidor<th>Tipo<th class="inv-num">Lleva<th>Estado<th><tbody></table></div></div><div class="xdlg-foot"><button class="btn btn-sm btn-light"dialog-dismiss><i class="fa fa-times"></i>Cancelar</button></div></div></paper-dialog><paper-dialog modal id="dlg_trk_pedidos"class="xdlg"entry-animation="scale-up-animation"exit-animation="fade-out-animation"><div class="xContent"><div class="xdlg-head"><h3 id="trk_dlg_titulo">Pedidos</h3><p id="trk_dlg_sub"></div><div class="xdlg-body"><div class="inv-table-wrap"><table class="inv-table"id="tb_trk_pedidos"><thead><tbody></table></div><div id="trk_dlg_pagos"></div></div><div class="xdlg-foot"><button class="btn btn-sm btn-light"dialog-dismiss><i class="fa fa-times"></i>Cerrar</button></div></div></paper-dialog><br><div class="xMiCard xradius inv-card"><div class="xEncanezadoCard inv-head"><div class="inv-head-top"><div><h3>Tracker Delivery</h3><p>Donde estan tus repartidores ahora mismo, cuantos pedidos llevan y cuanto estan tardando. Se actualiza solo cada 20 segundos.</div><div class="inv-head-acciones"><span class="trk-alerta"id="trk_alerta"></span> <span class="trk-actualizado"id="trk_actualizado"></span> <button class="btn btn-sm btn-light"onclick="xTrkComoActivar()"><i class="fa fa-question-circle"></i>Como activar el seguimiento</button> <button class="btn btn-sm btn-light"onclick="xTrkCargar()"><i class="fa fa-refresh"></i>Actualizar</button></div></div></div><div class="xContentCard"><div class="trk-aviso"id="trk_aviso_app"></div><div class="inv-kpis"id="trk_kpis"></div><div class="trk-mapa"id="trk_mapa"></div><div class="inv-titulo-sec">Repartidores</div><div class="inv-table-wrap"><table class="inv-table"id="tb_trk_repartidores"><thead><tr><th>Repartidor<th>Tipo<th>Estado<th class="inv-num">Por entregar<th class="inv-num">Entregados<th class="inv-num">Tiempo prom.<th><tbody></table></div><div class="inv-titulo-sec">Pedidos sin repartidor</div><div class="inv-table-wrap"><table class="inv-table"id="tb_trk_sin_asignar"><thead>
