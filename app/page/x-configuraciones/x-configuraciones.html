<link rel="import"href="../../x-componentes/x-comp-find-sede/x-comp-find-sede.html"><link rel="import"href="../../x-componentes/x-comp-find-comprobante/x-comp-find-comprobante.html"><link rel="import"href="../../x-componentes/x-comp-find-categoria/x-comp-find-categoria.html"><link rel="import"href="../../x-componentes/x-comp-handler-pinpad/x-comp-handler-pinpad.html"><link rel="import"href="./x-carta-virtual-config/x-carta-virtual-config.html"><link rel="import"href="./x-carta-virtual-config/x-carta-virtual-mesas.html"><link rel="import"href="../../page/x-configuraciones/x-config-sede-opciones/x-config-sede-opciones.html"><link rel="import"href="./x-areas-mesas/x-areas-mesas.html"><link rel="import"href="../../x-componentes/x-edit-tipo-precio/x-edit-tipo-precio.html"><link rel="import"href="./x-holding/x-create-holding.html"><dom-module id="x-configuraciones"><template><paper-dialog id="dialog_borrar"entry-animation="scale-up-animation"exit-animation="fade-out-animation"with-backdrop><div class="xtxtCentro"><img src="../../../images/_dlg_remove.gif"alt=""width="150px"></div><p>Esta seguro de querer borrar este registro?</p><br><div class="buttons"><button class="xBoton2 xPlomo"dialog-dismiss>Cancelar</button> <button class="xBoton2 xRojo"onclick="xDlgBorrar()">Si, borrar</button></div></paper-dialog><paper-dialog id="dialog_subir_file_alamcen"class="dialog_redondo"entry-animation="scale-up-animation"exit-animation="fade-out-animation"with-backdrop><div class="xContent"><h4>Selecciona el almacen donde ingresan los productos:</h4><select class="xTextRow2"id="sel_almacen_file"></select><br><br><br><div class="xBoton2 xVerde"onclick="xSubirFileAlmacen()">Listo, subir archivo e ingresar</div></div></paper-dialog><paper-dialog id="dialog_add_sede"class="dialog_redondo"style="max-width:550px;overflow:auto"entry-animation="scale-up-animation"exit-animation="fade-out-animation"with-backdrop><div class="xContent"><h4>DATOS DE SEDE</h4><div class="xLinea2"></div><br><div><div><form id="frm_sede"><input class="xMiInput xPasarEnter2"placeholder="DESCRIPCION"onchange="conMayusculas(this)"id="nombre"name="nombre"espaciar required> <input class="xMiInput xPasarEnter2"placeholder="DIRECCION"onchange="conMayusculas(this)"id="direccion"name="direccion"espaciar required><div class="d-flexx"><div><label for="ciudad"class="label-input">Ciudad</label> <input class="xMiInput xPasarEnter2"placeholder="CIUDAD"onchange="conMayusculas(this)"id="ciudad"name="ciudad"required> <label for="eslogan"class="label-input">Eslogan</label> <input class="xMiInput xPasarEnter2"placeholder="ESLOGAN"id="eslogan"name="eslogan"maxlength="100"></div><div><label for="mesas"class="label-input">Número de Mesas</label> <input type="number"class="xMiInput xPasarEnter2"placeholder="NUMERO DE MESAS"id="mesas"min="1"name="mesas"> <label for="telefono"class="label-input">Telefono</label> <input class="xMiInput xPasarEnter2"placeholder="TELEFONO"id="telefono"name="telefono"></div></div><br><div><p class="fw-600">Razón Social para comprobantes electronicos.<div><label for="ruc_cpe"class="label-input">Ruc</label> <input class="xMiInput xPasarEnter2"placeholder="RUC"onchange="conMayusculas(this)"id="ruc_cpe"name="ruc_cpe"espaciar required> <label for="razonsocial_cpe"class="label-input">Razón Social</label> <input class="xMiInput xPasarEnter2"placeholder="RAZON SOCIAL"onchange="conMayusculas(this)"id="razonsocial_cpe"name="razonsocial_cpe"espaciar required></div></div><div class="xInvisible"><input id="idsede"name="idsede"> <input id="idorg"name="idorg"value$="[[xt_org]]"></div><br><br><p class="fw-600">Email donde se enviaran los cierres de caja.<p class="text-secondary fs-12">Puede separar por comas ej. gerente@gmail.com, admin_local@hotmail.com</p><input class="xMiInput xPasarEnter2"placeholder="EMAIL"id="email_cierre"name="email_cierre"espaciar></form><br><button class="btn btn-primary"onclick="xGuardarSede()">Guardar</button> <button class="btn btn-secondary"onclick="dialog_add_sede.close()">Cancelar</button></div></div></div></paper-dialog><paper-dialog id="dialog_add_cat"class="dialog_redondo"style="max-width:450px"entry-animation="scale-up-animation"exit-animation="fade-out-animation"with-backdrop><div class="xContent"><h4>CARTA</h4><form id="frm_cat"><input class="xMiInput xPasarEnter2"placeholder="DESCRIPCION"onchange="conMayusculas(this)"id="descripcion"name="descripcion"espaciar required> <input class="xMiInput xPasarEnter2"placeholder="DETALLE"onchange="conMayusculas(this)"id="detalle"name="detalle"espaciar><br><br><p class="fw-600">Horario Atención:<p class="text-secondary fs-12">Hora en formato 24hrs ejemplo: 18:00<div class="d-flexx align-content-between"><input class="xMiInput xPasarEnter2"placeholder="HORA INICIO"onchange="conMayusculas(this)"id="hora_ini"name="hora_ini"espaciar> <input class="xMiInput xPasarEnter2"placeholder="HORA FINAL"onchange="conMayusculas(this)"id="hora_fin"name="hora_fin"espaciar></div><br><p class="fw-600">Dias Disponbles:<hr><label><input type="checkbox"name=""class="dia_disponible"value="2"checked="checked">Lunes</label> <label><input type="checkbox"name=""class="dia_disponible"value="3"checked="checked">Martes</label> <label><input type="checkbox"name=""class="dia_disponible"value="4"checked="checked">Miercoles</label> <label><input type="checkbox"name=""class="dia_disponible"value="5"checked="checked">Jueves</label> <label><input type="checkbox"name=""class="dia_disponible"value="6"checked="checked">Viernes</label> <label><input type="checkbox"name=""class="dia_disponible"value="7"checked="checked">Sabado</label> <label><input type="checkbox"name=""class="dia_disponible"value="1"checked="checked">Domingo</label><br><br><p class="fw-600">Permisos:<hr><label><input type="checkbox"name=""id="check_visible_cliente"checked="checked">Visible para el cliente (Delivery, Mozo Virtual)</label><br><label><input type="checkbox"name=""id="check_accesible_mozo">Accesible desde el app de pedidos (mozos) <strong>solo cuando este disponible.</strong></label><div class="xInvisible"><input id="idsede"name="idsede"value$="[[xt_idsede]]"> <input id="idorg"name="idorg"value$="[[xt_org]]"> <input id="dia_disponible"name="dia_disponible"> <input id="visible_cliente"name="visible_cliente"> <input id="accesible_mozo"name="accesible_mozo"> <input id="idcategoria"name="idcategoria"></div></form><br><br><div class="xLinea2"></div><br><br><div class="xBoton2 xAzul"onclick="xGuardarCategoria()">Guardar</div><div class="xBoton2 xPlomo"onclick="dialog_add_cat.close()">Cancelar</div></div></paper-dialog><paper-dialog id="dialog_add_tpc"style="width:300px"entry-animation="scale-up-animation"exit-animation="fade-out-animation"with-backdrop><div class="xContent"><h4>TIPO DE CONSUMO</h4><form id="frm_tpc"><input class="xMiInput xPasarEnter2"placeholder="DESCRIPCION"onchange="conMayusculas(this)"id="descripcion"name="descripcion"espaciar required><div class="xInvisible"><input id="idsede"name="idsede"value$="[[xt_idsede]]"> <input id="idorg"name="idorg"value$="[[xt_org]]"></div></form><br><br><div class="xLinea2"></div><br><br><div class="xBoton2 xAzul"onclick="xGuardarTPC()">Guardar</div><div class="xBoton2 xPlomo"onclick="dialog_add_tpc.close()">Cancelar</div></div></paper-dialog><paper-dialog id="dialog_img_ico_carta"class="dialog_redondo overflow-auto"entry-animation="scale-up-animation"exit-animation="fade-out-animation"with-backdrop><div class="xContent"><span class="xColorRow_Plomo">Este icono se mostrara en la aplicacion de pedidos</span><div class="content-icon-seccion"><template is="dom-repeat"items="{{listIconSeccion}}"as="item"><img data-index="[[index]]"onclick="updateIconSeccion(this)"class="img-ico-seccion-size-2"src="{{item.img}}"alt="a2"></template></div></div></paper-dialog><br><h3>CONFIGURACIONES</h3><div class="xLinea2"></div><br><div><paper-tabs selected="{{selected_conf}}"id="tab_cnf"scrollable><paper-tab>DATOS DEL ESTABLECIMINETO</paper-tab><paper-tab>CONFIGURACIONES DEL LOCAL</paper-tab><paper-tab>CATEGORIAS (CARTA)</paper-tab><paper-tab>TIPOS DE CONSUMO</paper-tab><paper-tab>REGLAS DE LA CARTA</paper-tab><paper-tab>DATOS DE IMPRESION</paper-tab><paper-tab>DESPACHO E IMPRESORAS</paper-tab><paper-tab>ALMACENES</paper-tab><paper-tab>EMISION DE COMPROBANTES</paper-tab><paper-tab>CARTA APP</paper-tab><paper-tab>AREAS Y MESAS</paper-tab><paper-tab>PIN PAD</paper-tab><paper-tab hidden$="[[isHiddenHolding]]">HOLDING</paper-tab></paper-tabs><div class="xLinea2"></div><br><iron-pages selected="{{selected_conf}}"><div id="div_datos_establecimiento"class="xAlinearce"style="width:100%"><div class="xm_at_cont xAlinearce xBordeDe"><form id="frm_org"><input class="xMiInput xPasarEnter2"placeholder="ESTABLECIMIENTO / ORGANIZACION"onchange="conMayusculas(this)"id="nombre"name="nombre"espaciar required> <input class="xMiInput xPasarEnter2"placeholder="DIRECCION"onchange="conMayusculas(this)"id="direccion"name="direccion"espaciar required> <input class="xMiInput xPasarEnter2"placeholder="RUC"onchange="conMayusculas(this)"id="ruc"name="ruc"espaciar required> <input class="xMiInput xPasarEnter2"placeholder="TELEFONO"onchange="conMayusculas(this)"id="telefono"name="telefono"espaciar required> <input type="email"class="xMiInput xPasarEnter2"placeholder="EMAIL CONTACTO"id="email"name="email"espaciar required><br><br><br><div class="xInvisible"><input id="idorg"name="idorg"value$="[[xt_org]]"></div><div class="xBoton2 xAzul"onclick="xGuardarOrg()">Guardar Cambios</div></form></div><div class="xm_at_cont xAlinearce"><table width="100%"class="xtable2"id="tb_org"><thead><th>SEDE<th>CIUDAD<th width="5px"></thead></table></div><br><br></div><div id="div_config_local"class="xContent"><h3>Configuraciones del local</h3><p class="text-secondary">Opciones de funcionamiento de esta sede: cierre de caja, stock, hora de cierre del día y app mozo.</p><br><x-config-sede-opciones id="compOpcionesLocal"></x-config-sede-opciones></div><div id="div_categoria"><p class="xBold">Agregue las cartas que el establecimiento ofrece. Por ejemplo: Desayunos, Almuerzos, Cenas, etc. O si es una categoria General.<br>Establesca la hora de inicio y final el sistema lo mostrara u ocultara automaticamente segun la hora.</p><br><paper-fab icon="add"onclick="dialog_add_cat.open()"title=""tabindex="0"class="verde btnAdd"></paper-fab><table width="100%"class="xtable2"id="tb_cat"><thead><th align="left">DESCRIPCION<th align="left">H. INICIO<th align="left">H. FINAL<th width="5px"><th width="5px"></thead></table></div><div id="div_tpc"><p class="xBold">Establecer los tipo de consumo que seran visibles en la carta, por ejemplo: Consumir en el Local, Para LLevar.</p><br><paper-fab icon="add"onclick="dialog_add_tpc.open()"title=""tabindex="0"class="verde btnAdd"></paper-fab><table width="100%"class="xtable2"id="tb_tpc"><thead><th align="left">DESCRIPCION<th width="5px"></thead></table><br><br><hr><br><br><div class="d-flexx"><div class="mr-5"><h3>Metodos de Pago Aceptatos.</h3><table><thead><th align="left">Metodo<th><tbody><template is="dom-repeat"items="{{listMetodoPagos}}"as="itemT"><tr><td>{{itemT.descripcion}}<td><paper-checkbox class="checkTP"checked$="{{itemT.aceptado}}"data-idt="{{itemT.idtipo_pago}}"onchange="updateMetodoPagoAceptado()"></paper-checkbox></template></table></div><div><x-edit-tipo-precio></x-edit-tipo-precio></div></div></div><div id="div_regla"><p class="xBold">Especifique las reglas que obedece la carta, como por ejemplo: Cada plato de fondo sale con una entrada.</p><br><label for="selCategoria">Categoria:</label> <select class="xTextRow2"id="selCategoria"inline></select><br><br><label for="selSeccion">Seccion :</label> <select class="xTextRow2"id="selSeccion"inline></select> <label for="selCon">Sale con:</label> <select class="xTextRow2"id="selCon"inline></select><div class="xBoton2 xAzul"onclick="xAddRegla()">Agregar Regla</div><div class="xInvisible"><form id="frm_regla"><input name="idorg"id="idorg"value$="[[xt_org]]"> <input name="idsede"id="idsede"value$="[[xt_idsede]]"> <input name="idcategoria"id="idcategoria"> <input name="idseccion"id="idseccion"> <input name="idseccion_detalle"id="idseccion_detalle"></form></div><br><br><br><table class="xtable2"style="max-width:600px;width:600px"id="tb_regla"><thead><th align="left">Categoria:<th align="left">Seccion:<th align="left">Sale con:<th></thead></table></div><div id="div_datos_print"><div><table id="tb_print"><tr><td><h3>IP Impresora</h3><span>Impresora ticketera donde se imprimiran los pedidos</span><td><input class="xMiInput"placeholder="IP xx.xx.xx.x"id="td_ip"><tr><td><h3>Numero de Copias</h3><span>Numero de Copias a imprimir por pedido</span><td><input class="xMiInput"placeholder="00"type="number"min="0"pattern="[0-9]+([\.,][0-9]+)?"step="any"id="td_copia"><tr><td><h3>Pie de pagina</h3><span>Mensaje en el pie de pagina para el pedido o comanda</span><td><textarea class="xMiInput"class="xMiInput"placeholder="Pie de pagina"maxlength="200"id="td_pie"cols="30"rows="6"></textarea><tr><td><h3>Pie de pagina para el comprobante</h3><span>Pie de pagina que se mostrara en el <strong>comprobante</strong></span><td><textarea class="xMiInput"placeholder="Pie de pagina comprobante"maxlength="255"id="td_pie_comprobante"cols="30"rows="8"></textarea><tr><td><h3>Pie de pagina para el Pre-cuenta</h3><span>Pie de pagina que se mostrara en la <strong>pre cuenta</strong> que se entrega al cliente.</span><td><textarea class="xMiInput"placeholder="Pie de pagina precuenta"maxlength="255"id="td_pie_precuenta"cols="30"rows="8"></textarea><tr><td><h3>Logo</h3><span>Logo a imprimir en el ticket, ancho remcomendado 450px</span><td><input class="xMiInput"placeholder="Logo"maxlength="200"onclick="xSeleccionarFoto()"id="td_logo"readonly="readonly"> <input type="file"class="xInvisible xobj_subir_foto"id="ctrl_open_file"accept="image/*"> <img id="imgLogo"src=""alt=""width="450"><tr><td><h3>Tamaño de letra</h3><span>Las impresoras ticketeras pueden tener hasta 3 tipos de fuente (0,1,2)</span><td><input class="xMiInput"placeholder="0"type="number"min="0"max="3"pattern="[0-9]+([\.,][0-9]+)?"step="any"id="td_size_font"><tr><td><h3>Margen Izquierda</h3><span>Por defecto es 0, aumentar cantidad para centrar</span><td><input class="xMiInput"placeholder="0"type="number"min="0"max="80"pattern="[0-9]+([\.,][0-9]+)?"step="any"id="td_margen_iz"><tr><td><h3>Tamaño de fuente en la comanda</h3><span>Por defecto es de tamaño default.</span><td><select class="xTextRow2 xCursor"name="sel_size_font_comanda"id="sel_size_font_comanda"><option value="0">Default<option value="1">Grande<option value="2">Extra</select><tr><td><h3>Comanda muestra subtotales?</h3><span>Si en la comanda muestra subtotales del pedido, es recomendable<br>que muestre si es una sola impresora</span><td><paper-checkbox id="check_isprint_subtotales_comanda"></paper-checkbox>Si<br><tr><td><h3>La copia en formato corto (Ahorro de papel)?</h3><span>Si se imprime una copia de la comanda que este muestro en formato corto, es decir<br>solo datos necesarios - ayuda a ahorrar papel</span><td><paper-checkbox id="check_isprint_copy_short"></paper-checkbox>Si<br><tr><td><h3>Imprimir todo en formato corto (Ahorro de papel)?</h3><span>Se imprime todas las comanda en formato corto, es decir solo<br>datos necesarios - ayuda a ahorrar papel</span><td><paper-checkbox id="check_isprint_all_short"></paper-checkbox>Si<br><tr><td><h3>Imprimir Precuentas y comprobantes en formato corto?</h3><span>Se imprime comprobantes y pre-cuentas agrupados por producto - ayuda a ahorrar papel</span><td><paper-checkbox id="check_isprint_cpe_short"></paper-checkbox>Si<br><tr><td><h3>Imprimir los pedidos delivery completo?</h3><span>Si tienes varias areas de producción los pedidos delivery<br>se imprimira completo en todas las areas.</span><td><paper-checkbox id="check_isprint_all_delivery"></paper-checkbox>Si<br><tr><td><h3>Imprimir seleccionables en vertical?</h3><span>Cada opcion del producto (seleccionables/subitems) se imprime<br>en su propia linea en vez de separadas por comas.</span><td><paper-checkbox id="check_isprint_subitems_vertical"></paper-checkbox>Si<br></table><br><br><div class="xBoton2 xAzul"onclick="xGuardarCambioPrint()">Guardar Cambios</div><div class="xBoton2 xVerde"onclick="xPruebaTestPrint()">Test Impresion</div><div class="xInvisible"><form id="frm_conf_print"><input id="idconf_print"name="idconf_print"> <input id="ip_print"name="ip_print"> <input id="num_copias"name="num_copias"> <input id="pie_pagina"name="pie_pagina"> <input id="pie_pagina_comprobante"name="pie_pagina_comprobante"> <input id="pie_pagina_precuenta"name="pie_pagina_precuenta"> <input id="var_size_font"name="var_size_font"> <input id="var_margen_iz"name="var_margen_iz"> <input id="var_size_font_tall_comanda"name="var_size_font_tall_comanda"> <input id="isprint_subtotales_comanda"name="isprint_subtotales_comanda"> <input id="isprint_copy_short"name="isprint_copy_short"> <input id="isprint_all_short"name="isprint_all_short"> <input id="isprint_cpe_short"name="isprint_cpe_short"> <input id="isprint_all_delivery"name="isprint_all_delivery"> <input id="isprint_subitems_vertical"name="isprint_subitems_vertical"> <input id="idorg"name="idorg"value$="[[xt_org]]"> <input id="idsede"name="idsede"value$="[[xt_idsede]]"></form></div><br><br><br><div class="xLinea2"></div><br><h3 class="xBold">SUB TOTALES</h3><br><h4>IMPUESTOS</h4><p>Ingrese el porcentaje del I.G.V. en numeros, si esta exonerado solo quite el check de activo; dejando especificado el porcentaje del impuesto (se utilizara para calcular otras operaciones).<div class="xLinea2"></div><br><br><form method="post"id="formProcentaje"><table id="tb_porcentaje"class="xtable1"width="38%"><thead><th>Activo<th>Impuesto<th align="center">Porcentaje<tbody></table><div class="xInvisible"><input id="idconf_print"name="idconf_print"></div></form><br><br><h3 class="xBold">SERVICIOS NO FACTURABLES</h3><p>Servicios no facturables como: propinas o donativos, importes que no son percibido por el restaurante.<br>Por ejemplo para cargar el servicio de atencion (propinas) podria configurar: Descripcion: Servicio , Porcentaje: 10.<br>Esto sumaria 10% del total de la cuenta. Que seria percibido por el mozo que atendio el pedido o mesa.<br><br>Si el servicio es opcional, se cobra siempre que el usuario lo marque.<div class="xLinea2"></div><br><br><form method="post"id="formProcentajeNoFacturable"><table id="tb_porcentaje_no_facturable"class="xtable1"width="50%"><tr data-id=""class="xSinBorde"><td><input class="xMiInput"placeholder="Descripcion"onchange="conMayusculas(this)"name="descripcion"id="descripcion"required><td><input type="number"min="0"class="xMiInput"placeholder="porcentaje"pattern="0|[1-9][0-9]*"name="porcentaje"id="porcentaje"required><td align="center"><p>Opcional</p><paper-checkbox id="check_opcional_no_facturable"class="check_opcional"></paper-checkbox><td><paper-fab icon="add"onclick="xAddPorcentaje()"title="Guardar"tabindex="0"></paper-fab></table><div class="xInvisible"><input id="idsede"name="idsede"> <input id="idorg"name="idorg"> <input id="idconf_print"name="idconf_print"> <input id="is_opcional"name="is_opcional"></div></form><br><br><h3 class="xBold">COSTOS ADICIONALES</h3><p>Ingrese los costos adicionales según tipo de consumo.<br>Ejemplo: Para llevar ó Delivery, Descripcion: Taper, Tipo de consumo: Para llevar, Seccion:Platos de fondo, Importe:1.00 <strong>(por cada item)</strong> es decir por cada taper.<br>Tambien puede ingresar servicios fijos que se cobran <strong>por pedido.</strong> Ejemplo: En el servicio de Delivery se suele cobrar un monto fijo por el transporte. Quedando de esta manera: Descripcion: Servicio delivery, Tipo consumo: Delivery, Por: Pedido, Impore: 3.00.<div class="xLinea2"></div><br><br><form method="post"id="formAdicionales"><table id="tb_Adicionales"class="xtable1"><tr data-id=""class="xSinBorde"><td>Activo<td><input class="xMiInput"placeholder="Descripcion"onchange="conMayusculas(this)"name="descripcion"id="descripcion"required><td><select class="xTextRow2"id="selTPC_adicional"inline></select><td><select class="xTextRow2"id="selNivel_adicional"inline></select><td><select class="xTextRow2"id="selSeccion_adicional"inline></select><td><input type="number"min="0"class="xMiInput"placeholder="Importe"pattern="0|[1-9][0-9]*"name="importe"id="importe"onblur="xRetornaMoneda(this)"required><td><paper-fab icon="add"onclick="xAddAdicional()"title="Guardar"tabindex="0"></paper-fab></table><div class="xInvisible"><input id="idconf_print"name="idconf_print"> <input id="idtipo_consumo"name="idtipo_consumo"> <input id="nivel"name="nivel"> <input id="idseccion"name="idseccion"></div></form><br><br></div></div><div id="div_impresoras"class="xContent"><h3 class="xBold">Zona de despacho e Impresoras</h3><p>Listado de zonas de despacho e impresoras. Si no utilizara impresoras, especifique solo la zona de despacho. Ej: Cocina, Bar, etc...<div class="xLinea2"></div><br><p>Antes de agregar impresora se recomienda hacer un test de impresion.<p><strong>Recurso compartido:</strong> la impresora esta conectada a una computadora por usb, compartala y escriba la direccion ejemplo: //usuario:clave@ippc/nomimpresora<p><strong>Minutos ':</strong> Tiempo promedio en minutos que toma en despachar un pedido. Ej: En Cocina el tiempo promedio para despachar un pedido es de 15minutos; en Bar es de 3minutos. <strong>(Solo si trabaja con tablets en las zonas de despacho)</strong><p><strong>img64 ':</strong> Indica si la impresora recibira las imagenes en 64bits</p><br><form method="post"id="form_impresoras"><table id="tb_impresoras"class="xtable1"><thead><th><p>Zona de despacho<p><p class="xfont10">Donde se imprime o muestra<p><th><p>Minutos '<p><p class="xfont10">tiempo promedio para depachar<p><th><p>Impresora<p>IP / recurso compartido<th>Copias<th><p>.<p>Tamaño de letra<th><p>.<p>Margen Izquierda<th><p>.<p>img64<th><p>.<p>Papel<th><paper-fab icon="add"onclick="xAddImpresora()"title="Agregar"tabindex="0"></paper-fab></thead><tr data-id=""class="xSinBorde tr_addPrint"><td><input class="xMiInput xPasarEnter2"placeholder="Zona de despacho"name="descripcion"id="descripcion"onchange="conMayusculas(this)"required><td><input class="xMiInput xPasarEnter2"placeholder=""type="number"min="0"max="60"pattern="[0-9]+([\.,][0-9]+)?"step="any"id="minutos_pedido"name="minutos_pedido"><td><input class="xMiInput xPasarEnter2"placeholder="Impresora"name="ip"id="ip"required><td><input class="xMiInput xPasarEnter2"placeholder="0"type="number"min="0"max="5"pattern="[0-9]+([\.,][0-9]+)?"step="any"id="num_copias"name="num_copias"><td><input class="xMiInput xPasarEnter2"placeholder="0"type="number"min="0"max="3"pattern="[0-9]+([\.,][0-9]+)?"step="any"id="var_size_font"name="var_size_font"><td><input class="xMiInput"placeholder="0"type="number"min="0"pattern="[0-9]+([\.,][0-9]+)?"step="any"id="var_margen_iz"name="var_margen_iz"><td><input class="xMiInput"placeholder="0"type="number"min="0"max="1"pattern="[0-9]+([\.,][0-9]+)?"step="any"id="img64"name="img64"><td><select id="select_papel_zona"><option value="0">80 mm<option value="1">58 mm</select><td><a href="#"onclick="xTestPrint(0)">Test Impresion</a></table><div class="xInvisible"><input id="idorg"name="idorg"value$="[[xt_org]]"> <input id="idsede"name="idsede"value$="[[xt_idsede]]"></div></form><br><br><div class="xLinea2"></div><br><h3 class="xBold">Secciones e impresoras</h3><p>Cada seccion puede imprimirse o mostrarse en las pantallas de diferentes zonas de despacho, por ejemplo: La seccion "platos a la carta" se imprimira o mostrara en la cocina; la seccion "tragos" se imprimira o mostrara en el bar.</p><br><table id="tb_sec_impr"class="xtable1"><thead><th>Seccion<th>Imprime o muestra en:<th></thead></table><div class="xInvisible"><select id="sel_impr_Sec"></select> <select id="sel_impr_Sec_otro"></select></div><br><br><div class="xLinea2"></div><br><div id="div_impresora_tpc"><h3 class="xBold">Impresora por canal de consumo</h3><p>Seleccione la impresora donde se imprimiran los pedidos según el canal de consumo. Al realizar esta asignacion se omitira la configuración de las secciones.</p><br><table id="tb_sec_impr_tpc"class="xtable1"><thead><th>Canal<th>Imprime o muestra en:</thead></table><div class="xInvisible"><select id="sel_impr_tpc"></select></div><br><br><div class="xLinea2"></div><br></div><div id="div_impresora_area"><h3 class="xBold">Impresora por área de mesas</h3><p style="margin-bottom:14px">Úsalo cuando un área de mesas tiene su propia impresora.<p style="margin-bottom:14px"><b>Ejemplo:</b> tienes una barra en cada piso. En "Secciones e impresoras" los tragos van a <b>BARRA 1</b>. Aquí agregas: <b>PISO 2</b> · en vez de <b>BARRA 1</b> · imprimir en <b>BARRA 2</b>.<br>Resultado: los tragos de las mesas del piso 2 salen en la barra del piso 2. El piso 1 sigue igual y la cocina no cambia.<p style="margin-bottom:14px"><b>Pre-cuenta del mozo (celular o tablet):</b> recomendado, crea una impresora solo para pre-cuenta, por ejemplo <b>PRECUENTA</b>, con la IP de la impresora del piso 1, y elígela en "Otros comprobantes" → Pre-cuenta. Luego agrega aquí: <b>PISO 2</b> · en vez de <b>PRECUENTA</b> · imprimir en <b>BARRA 2</b>.<br>Resultado: la cuenta de la mesa 5 (piso 1) sale abajo y la de la mesa 25 (piso 2) sale en BARRA 2.<p class="text-secondary"style="margin-bottom:14px">Para llevar y delivery no cambian. Las estaciones con impresora propia siguen sacando su pre-cuenta en su impresora. No le pongas a PRECUENTA la misma IP que BARRA 1. Las áreas se crean en "Áreas y Mesas".</p><br><table id="tb_impr_area"class="xtable1"><thead><th>Área<th>En vez de<th>Imprimir en<th><tbody><tr><td><select id="sel_impr_area_area"></select><td><select id="sel_impr_area_origen"></select><td><select id="sel_impr_area_destino"></select><td><button type="button"class="btn btn-sm btn-primary"onclick="xAgregarReglaImpresoraArea()">+ Agregar</button><tr><td colspan="4"class="text-danger fw-600"id="msj_impr_area"style="display:none"><tbody id="tb_impr_area_reglas"></table><br><br><div class="xLinea2"></div><br></div><div class="xInvisible"id="div_secciones_bodega"><h3 class="xBold">Secciones de Bodega</h3><p>Tiene un almacen que hace de bodega, Cada seccion puede imprimirse o mostrarse en las pantallas de diferentes zonas de despacho, por ejemplo: La seccion "Cervezas" se imprimira o mostrara en el bar.</p><br><table id="tb_sec_impr_bodega"class="xtable1"><thead><th>Seccion<th>Imprime o muestra en:</thead></table><div class="xInvisible"><select id="sel_impr_Sec_bodega"></select></div><br><br><div class="xLinea2"></div><br></div><h3 class="xBold">Otros comprobantes</h3><p>Seleccione en que impresora se imprimiran los siguientes comprobantes</p><br><table id="tb_otros_dic"class="xtable1"><thead><th>Descripcion<th>Imprime en:</thead><tr class="row"data-id="-1"><td>Pre-cuenta<td class="td_sel_ot_print"id="row-1"><tr class="row"data-id="-2"><td>Comprobantes (facturas,boletas,tickes)<td class="td_sel_ot_print"id="row-2"><tr class="row"data-id="-3"><td>Cierre de caja<td class="td_sel_ot_print"id="row-3"><tr class="row"data-id="-4"><td>Listado de compras (modulo compras)<td class="td_sel_ot_print"id="row-4"><tr class="row"data-id="-5"><td>Produccion<td class="td_sel_ot_print"id="row-5"><tr class="row"data-id="-6"><td>Distribuicion<td class="td_sel_ot_print"id="row-6"><tr class="row"data-id="-7"><td>Orden de Pedido<td class="td_sel_ot_print"id="row-7"></table><br><br><div class="xLinea2"></div><br><h3 class="xBold">Impresora Local</h3><p>Agrega una impresora local que se usara solo con este terminal o con esta computadora.<br>Esto se utiliza en el escenario de que cada caja tenga su impresora, por ejemplo puede tener 2 cajas o mas cada una con su respectiva impresora.<br>Esto tambien implica que los <strong>"Otros comprobantes"</strong> se enviaran a imprimir a esta impresora.<br><strong>Img64:</strong> 1 Indica que las imagenes se imprimiran desde un mapa de bits.</p><br><form method="post"id="form_impresora_local"><paper-checkbox id="check_print_copia_local"onclick="printCopialocalAll()"></paper-checkbox>Imprimir una copia del pedido en la impresora local, para control interno o para el cliente.<br><br><table id="tb_impresora_local"class="xtable1"><thead><th>Descripcion<th>IP / recurso compartido<th>Copias<th>Tamaño de letra<th>Margen Izquierda<th>Img64<th>Papel<th></thead><tr data-id=""class="xSinBorde tr_addPrint_local"data-t="impresora"><td><input class="xMiInput xPasarEnter2"placeholder="Descripcion"name="descripcion"id="descripcion"required><td><input class="xMiInput xPasarEnter2"placeholder="Descripcion"name="ip"id="ip"required><td><input class="xMiInput xPasarEnter2"placeholder="0"type="number"min="0"max="3"pattern="[0-9]+([\.,][0-9]+)?"step="any"id="num_copias"name="num_copias"><td><input class="xMiInput xPasarEnter2"placeholder="0"type="number"min="0"max="3"pattern="[0-9]+([\.,][0-9]+)?"step="any"id="var_size_font"name="var_size_font"><td><input class="xMiInput"placeholder="0"type="number"min="0"max="3"pattern="[0-9]+([\.,][0-9]+)?"step="any"id="var_margen_iz"name="var_margen_iz"><td><input class="xMiInput"placeholder="0"type="number"min="0"max="2"pattern="[0-9]+([\.,][0-9]+)?"step="any"id="img64"name="img64"><td><select id="select_papel_caja"><option value="0">80 mm<option value="1">58 mm</select><td><a href="#"onclick="xAddImpresora_local()">Guardar</a><td><a href="#"onclick="xTestPrint(1)">Test Impresion</a><td><a href="#"onclick="xBorrarItemPrintLocal(this)"id="btn_borrar_print_local"class="xInvisible">Anular</a></table><div class="xInvisible"><input id="idimpresora"name="idimpresora"> <input id="idorg"name="idorg"value$="[[xt_org]]"> <input id="idsede"name="idsede"value$="[[xt_idsede]]"> <input id="local"name="local"value="1"></div></form><br><br><br></div><div id="div_almacenes"class="xContent"><h3>Listado de almacenes</h3><p><strong>Es bodega?:</strong> Identifica el almacen donde estan los productos para la venta al publico, esto tambien figuran en la carta<p><strong>Imprime en pedido?:</strong> Si en el pedido hay solo productos de este almacen imprime comanda o no?<p><strong>Venta Interna:</strong> Los productos del almacen estan disponibles en venta rapida solo para personal autorizado, clientes no tienen acceso<div class="xLinea2"></div><br><br><form method="post"id="form_almacen"><table id="tb_almacenes"class="xtable1"><thead><th>Descripcion<th>Es bodega?<th>Imprime en pedido?<th>Venta interna</thead><tr data-id=""class="xSinBorde"><td><input class="xMiInput"placeholder="Descripcion"onchange="conMayusculas(this)"name="descripcion"id="descripcion"required><td><select id="sel_bodega"><option value="0">NO<option value="1">SI</select><td><select id="sel_imprime_comanda"><option value="0">NO<option value="1">SI</select><td><select id="sel_solo_venta_interna"><option value="0">NO<option value="1">SI</select><td><paper-fab icon="add"onclick="xAddAlmacen()"title="Guardar"tabindex="0"></paper-fab></table><div class="xInvisible"><input id="idalmacen"name="idalmacen"> <input id="bodega"name="bodega"> <input id="imprimir_comanda"name="imprimir_comanda"> <input id="solo_venta_interna"name="solo_venta_interna"> <input id="idorg"name="idorg"value$="[[xt_org]]"> <input id="idsede"name="idsede"value$="[[xt_idsede]]"></div><br><br><div class="xLinea2"></div><br><h3>Stock Inicial</h3><p>Descarga el archivo excel para realizar el inventario inicial, luego selecciona el almacen donde ingresaran los productos y sube el archivo. Es importante que respete el formato del archivo.</p><br><div class="xBoton2 xAzul"onclick="xDescargarXls()"><img src="../../../images/x_down.png">Descargar Archivo</div><div class="xBoton2 xVerde"onclick="dialog_subir_file_alamcen.open()"><img src="../../../images/x_up.png">Subir Archivo</div><input class="xInvisible"type="file"id="fileAlamcen"><br></form><br><br></div><div id="div_emision_comprobantes"class="xContent"><h3>Configuracion para emitir comprobantes.</h3><p>Indique comprobantes de pago que emite, asi como las serie y el ultimo numero correlativo emitido.<p>Es apartir del ultimo correlativo emitido que el sistema empezara a emnumerar los comprobantes. Ej; ultimo correlativo emitido 100, entonces el sistema emitira 101.<div class="xLinea2"></div><br><br><form method="post"id="form_emision_comprobante"><table id="tb_emision_comprobantes"class="xtable1"><thead><th>Sede<th>Comprobante<th>Serie<th>Correlativo</thead><tr data-id=""class="xSinBorde"><td><x-comp-find-sede id="compFindSede"onchange="_getSede(sedes)"></x-comp-find-sede><td><x-comp-find-comprobante id="compFindComprobante"showicons="[[showIconsListCPE]]"op="2"onchange="_getComprobante(comprobantes)"></x-comp-find-comprobante><td><input autocomplete="off"class="xMiInput"placeholder="Serie"onchange="conMayusculas(this)"name="serie"id="serie"required><td><input class="xMiInput"placeholder="Correlativo"type="number"min="0"pattern="[0-9]+([\.,][0-9]+)?"step="any"name="correlativo"id="correlativo"required><td><paper-fab icon="add"onclick="config_comprobante_add()"title="Guardar"tabindex="0"></paper-fab></table><div class="xInvisible"><input id="idsede"name="idsede"> <input id="idorg"name="idorg"value$="[[xt_org]]"> <input id="idtipo_comprobante"name="idtipo_comprobante"></div></form><br><br><h3>Comprobante Electronico.</h3><p>Para activar la emisión de comprobantes electrónicos necesita un token único y una llave digital que son proporcionados por el equipo de soporte tecnico.<p><strong>Importante: </strong>Para la facturacion electronica, es requerido indicar en la informacion de la sede: El ubigeo y el codigo de domicio fiscal.<div class="xLinea2"></div><br><br><br><br><br></div><div id="div_carta_app"class="xContent"><x-carta-virtual-config></x-carta-virtual-config><br><br><x-carta-virtual-mesas></x-carta-virtual-mesas></div><div id="div_areas_mesas"class="xContent"><x-areas-mesas></x-areas-mesas></div><div id="div_pin_pad"class="xContent"><h3>Agregar PinPad</h3><p>Para agregar un pinpad, debe especificar los siguientes datos:<br>Especifique el modelo por ejemplo <strong>P400</strong>. El numero SN que se encuentra en la parte de atrás del pinpad.<br>Y el area donde estara ubicado el pinpad, por ejemplo <strong>caja 1</strong> o <strong>caja 2</strong>.</p><br><p>Luego de agregar el pinpad, cada area debe asignarse el que le corresponde y hacer la prueba de conexión.</p><br><x-comp-handler-pinpad></x-comp-handler-pinpad></div><div id="div_holding"class="xContent"hidden$="[[isHiddenHolding]]"><x-create-holding></x-create-holding></div></iron-pages></div></template><style>.label-input{margin-left:5px;font-size:10px;color:grey}</style></dom-module><script src="config_comporbantes.js"></script><script src="../../shared/config.const.js"></script><script src="../../view/item_pedido_print_comprobante.js"></script><script src="../../view/socket.master.service.js"></script><script src="../../view/socket.service.p.js"></script><script>var xThisConfig,isSocket,xidSeccionIcon,opIcon,_arrPrintLocal=[],numIconSeccion=244,xRutaIconSeccion="../../images/img-icon-carta/",xObjBorrar=0;function _getCategoria(e){}function _cpMarcarSnapshotVencido(){try{window.localStorage.setItem("::app3_woDUS_stale","1")}catch(e){}}function _cpOnAjaxSuccess(e,a,o){o=o&&o.url||"";-1===o.indexOf("bdphp/")||-1<o.indexOf("op=-1111")||-1<o.indexOf("op=-1112")||_cpMarcarSnapshotVencido()}function _cpMarcarSnapshotAlGuardar(e){$(document).off("ajaxSuccess",_cpOnAjaxSuccess),e&&$(document).on("ajaxSuccess",_cpOnAjaxSuccess)}function xIniConf(){xPopupLoad=document.getElementById("xLoad"),xm_LogChequea(function(){var e;xm_log_get("ini_us"),$("body").addClass("loaded"),xThisConfig.xt_org=xIdOrg,xThisConfig.xt_idsede=xIdSede,xThisConfig.xt_idus=xIdUsuario,""!==xIdOrg&&null!=xIdOrg||(e=xm_log_get("app3_us"),xThisConfig.xt_org=e.ido,xThisConfig.xt_idsede=e.idsede,xThisConfig.xt_idus=e.idus),_arrPrintLocal=[],xLoadOrg(),xLoadCategoria(),isSocket=0!==par
