<dom-module id="x-vincular-yape"><template><style>.wz-steps{display:flex;flex-wrap:wrap;gap:14px;margin:10px 0 20px 0}.wz-step{flex:1 1 200px;border:1px solid #e0e0e0;border-radius:10px;padding:14px;background:#fff}.wz-step span{display:inline-block;width:26px;height:26px;line-height:26px;text-align:center;border-radius:50%;background:#6c3fc5;color:#fff;font-weight:600;margin-bottom:8px}.wz-actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.wz-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:8px;border:1px solid #c5c5c5;background:#fff;color:#333;text-decoration:none;cursor:pointer;font-weight:600}.wz-btn.primary{background:#6c3fc5;border-color:#6c3fc5;color:#fff}.wz-btn img{width:22px;height:22px}.wz-note{background:#f3eefc;padding:10px 12px;border-radius:6px}</style><br><div class="xMiCard xradius"style="width:85%;max-width:1100px"><div class="xEncanezadoCard"style="background:#fff0f5;color:#424242"><div class="d-flexx align-items-center"style="gap:12px"><img src="../../../images/_wizpay_64.png"alt="WizPay"style="width:48px;height:48px"><div><h3 style="margin:0">Vincular Yape / Plin con WizPay</h3><span>Tu cajero confirma los pagos Yape y Plin al instante, aunque el dueño no esté en el local.</span></div></div></div><div class="xContentCard"style="height:100%"><p>El dueño puede estar descansando, manejando o lejos del negocio. <strong>WizPay</strong> detecta la notificación del pago en su celular <strong>Android</strong> y la envía automáticamente a la computadora de caja. El cajero ve el pago confirmado sin llamar al dueño y sin depender de una captura de pantalla que puede ser falsa.<p class="wz-note"><strong>WizPay solo verifica pagos recibidos, no mueve tu dinero.</strong> El celular del dueño solo necesita batería y recibir notificaciones, puede estar encendido o suspendido.<h4>Cómo funciona en 4 pasos</h4><div class="wz-steps"><div class="wz-step"><span>1</span><p>El dueño instala la app <strong>WizPay</strong> en su celular <strong>Android</strong> (el mismo donde recibe las notificaciones de Yape o Plin). <strong class="text-danger">NO IPHONE</strong>.</div><div class="wz-step"><span>2</span><p>En la app obtiene su <strong>código seguro de vinculación</strong>.</div><div class="wz-step"><span>3</span><p>El cajero abre el <strong>receptor</strong> en la computadora de caja e ingresa ese código.</div><div class="wz-step"><span>4</span><p>La caja recibe los pagos confirmados <strong>al instante</strong>.</div></div><h4>Accesos directos</h4><div class="wz-actions"><a class="wz-btn primary"href$="[[urlApp]]"target="_blank"rel="noopener"title="Google Play"><i class="fa fa-android"></i> Descargar app para el dueño (Android) </a><a class="wz-btn"href$="[[urlReceptor]]"target="_blank"rel="noopener"title="Receptor para la caja"><i class="fa fa-desktop"></i> Abrir receptor (caja) </a><a class="wz-btn"href$="[[urlInfo]]"target="_blank"rel="noopener"><i class="fa fa-info-circle"></i> Ver cómo funciona</a></div><br><p class="fs-11 text-secondary">El receptor funciona en cualquier navegador (PC, Android o iPhone). Si el dueño cambia de celular, recupera su negocio iniciando sesión en la app. Soporte: <a href="mailto:soporte@papaya.com.pe">soporte@papaya.com.pe</a></div></div></template><script>Polymer({is:"x-vincular-yape",properties:{urlApp:{type:String,value:"https://play.google.com/store/apps/details?id=pe.papaya.wizpay"},urlReceptor:{type:String,value:"https://wizpay.papaya.com.pe/receptor/"},urlInfo:{type:String,value:"https://wizpay.papaya.com.pe/"}},attached:function(){xm_log_get("ini_us"),$("body").addClass("loaded")}})</script></dom-module>
