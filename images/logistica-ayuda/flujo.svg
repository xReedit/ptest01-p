<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 432" role="img" aria-label="La sede pide, la central decide y despacha, la sede confirma" font-family="Segoe UI, Arial, sans-serif" font-size="13">
	<defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9ca3af"/></marker></defs>
	<rect width="760" height="432" rx="10" fill="#fff"/>
	<text x="24" y="34" font-size="15" font-weight="600" fill="#212529">La sede pide, la central decide y despacha, la sede confirma</text>
	<g fill="none" stroke="#9ca3af" stroke-width="1.25" marker-end="url(#f)">
		<path d="M244 120H270"/><path d="M490 120H516"/><path d="M626 148V232"/><path d="M380 148V232"/>
		<path d="M516 260H490"/><path d="M270 260H244"/><path d="M380 352V288"/>
	</g>
	<g fill="#fff" stroke="#9ca3af" stroke-width="1.25">
		<rect x="24" y="92" width="220" height="56" rx="8"/><rect x="516" y="92" width="220" height="56" rx="8"/>
		<rect x="516" y="232" width="220" height="56" rx="8"/><rect x="270" y="232" width="220" height="56" rx="8"/>
		<rect x="24" y="232" width="220" height="56" rx="8"/><rect x="270" y="352" width="220" height="56" rx="8"/>
	</g>
	<rect x="270" y="92" width="220" height="56" rx="8" fill="#edf2ff" stroke="#007bff" stroke-width="2"/>
	<g text-anchor="middle" font-weight="600" fill="#212529">
		<text x="134" y="116">1 · La sede pide</text><text x="380" y="116">2 · La central decide</text><text x="626" y="116">3 · Orden de compra</text>
		<text x="626" y="256">Almacén central</text><text x="380" y="256">4 · Envíos</text><text x="134" y="256">5 · La sede recibe</text>
		<text x="380" y="376">Otra sede</text>
	</g>
	<g text-anchor="middle" font-size="11.5" fill="#6c757d">
		<text x="134" y="134">lista sugerida por sus ventas</text><text x="380" y="134">almacén, otra sede o comprar</text><text x="626" y="134">al proveedor, con fecha</text>
		<text x="626" y="274">entra lo que llegó (Recepción)</text><text x="380" y="274">ruta del día y chofer</text><text x="134" y="274">confirma lo que llegó</text>
		<text x="380" y="394">con stock parado</text>
	</g>
	<g font-size="11.5" fill="#6c757d"><text x="634" y="194">llegó</text><text x="388" y="194">decide de dónde sale</text><text x="388" y="324">traer lo parado</text></g>
</svg>
